name: Inphi
description: >-
  Inphi Corporation (formerly NYSE: IPHI) was a fabless semiconductor company that
  designed high-speed analog and mixed-signal interconnect components -- SerDes,
  PAM4 DSPs, optical DSPs, and coherent DSPs -- used to move data across networks
  and inside data centers, from cloud and telecom infrastructure to long-haul and
  metro optical transport. Founded in 2000 and headquartered in Santa Clara,
  California, Inphi was acquired by Marvell Technology in April 2021 and folded into
  Marvell's data-center and connectivity portfolio; its former inphi.com domain now
  301-redirects to marvell.com. As a semiconductor hardware company, Inphi did not
  publish a public developer API, portal, SDKs, or OpenAPI surface. This profile is
  retained in the API Evangelist network as a venture-portfolio company record.
